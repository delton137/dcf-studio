# DCF Studio configuration. Restart the server after editing.

[server]
host = "127.0.0.1"          # never expose: the server launches autonomous agents
port = 8765

[runs]
max_concurrent = 3          # agent runs (new/update) at once
max_concurrent_imports = 4  # Sonnet legacy-conversion jobs at once
timeout_minutes = 90        # per agent turn
fix_attempts = 2            # validation-fix follow-ups after a failed validation
sec_user_agent = "Dan personal DCF research (DCF Studio) delton17@gmail.com"

# model = "latest" -> the newest model the CLI offers at run time (discovered live; see the
# run launcher). An alias like "opus" also floats to the newest model of that family.
[backends.claude]
model = "opus"
effort = "high"
max_budget_usd = 25         # hard stop per turn (Claude only)

[backends.codex]
model = "latest"
effort = "high"

[backends.grok]
model = "latest"
effort = "high"

[backends.agy]
model = "latest"
effort = "high"

[imports]
model = "sonnet"            # Claude model for legacy conversion agents
effort = "medium"
max_budget_usd = 6

[prices]
provider = "yahoo"           # Yahoo chart endpoint (no key); manual override in the UI

[screener]
min_market_cap = 1000       # $M, default universe ("US filers >= $1B")
r = 0.10                    # reverse-DCF-lite discount rate
g_t = 0.025                 # terminal growth
target_margin = 0.15        # FCF margin reached by year 10 for cash-burners
auto_refresh_hours = 20     # refresh at startup when the table is older than this
agent_model = "sonnet"
agent_effort = "medium"
agent_budget_usd = 3
